name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The checks only read the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commits the v4 tags pointed at, so a moved tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # No npm install: package.json has no dependencies, and the checks need only Node.
      - run: npm test --if-present
